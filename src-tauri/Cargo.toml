[package]
name = "scanline_term"
version = "0.1.0"
description = "Desktop shell for the Scanline Term CRT demo"
authors = ["Michael Voitovich and contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
conpty-oxide = "0.1.2"
tauri = { version = "2.11.1", features = [] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
